<section class="recognition section-tight" id="recognition" data-recognition-root data-header-theme="light" aria-label="Reconhecimento">
  <div class="container">
    <div class="stack" style="text-align: center; max-width: 50ch; margin-inline: auto; margin-bottom: var(--space-xl); gap: var(--space-sm);">
      <p class="text-label" data-recognition-eyebrow></p>
      <h2 class="text-display-md" data-recognition-title></h2>
    </div>

    <div class="milestone-slider">
      <div data-recognition-track></div>
      <div class="milestone__nav">
        <button type="button" class="icon-btn" data-milestone-prev aria-label="Marco anterior">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 18l-6-6 6-6" /></svg>
        </button>
        <div class="milestone__dots" data-recognition-dots></div>
        <button type="button" class="icon-btn" data-milestone-next aria-label="Marco seguinte">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 6l6 6-6 6" /></svg>
        </button>
      </div>
    </div>

    <p class="text-body-sm" style="text-align: center; margin-top: var(--space-lg); color: var(--color-text-on-light-muted); max-width: 55ch; margin-inline: auto;" data-recognition-note></p>
  </div>
</section>
