<section class="species section" id="species" data-species-root aria-label="Espécies">
  <div class="container">
    <div class="section-header">
      <div class="section-header__copy">
        <p class="text-label" data-species-eyebrow></p>
        <h2 class="text-display-lg" data-species-title></h2>
      </div>
      <p class="text-body measure-narrow" data-species-text></p>
    </div>

    <div class="species__stage" data-species-stage>
      <div class="species__track" data-species-track></div>
    </div>

    <div class="species__footer">
      <div class="species__controls">
        <button type="button" class="icon-btn" data-species-prev aria-label="Espécie anterior">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 18l-6-6 6-6" /></svg>
        </button>
        <button type="button" class="icon-btn" data-species-next aria-label="Espécie seguinte">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 6l6 6-6 6" /></svg>
        </button>
      </div>
      <p class="species__counter">
        <span data-species-counter-current>01</span> / <span data-species-counter-total>07</span>
      </p>
    </div>
  </div>

  <noscript>
    <div class="container">
      <p>Peixe-lua, Lontra-marinha, Tubarão-touro, Raia-manta, Enguia-jardim, Medusa, Coral — entre mais de 500 espécies do Oceanário de Lisboa.</p>
    </div>
  </noscript>
</section>
