<header class="site-header" data-site-header>
  <div class="container site-header__inner">
    <a class="site-header__logo" href="#hero">
      Oceanário <span>de Lisboa</span>
    </a>

    <div class="site-header__actions">
      <div class="lang-switch" role="group" aria-label="Idioma">
        <button type="button" class="lang-switch__btn is-active" aria-current="true">
          PT<span data-lang-full class="sr-only"> — Português</span>
        </button>
        <a class="lang-switch__btn" href="https://oceanario.pt/en/" target="_blank" rel="noopener noreferrer" title="Versão em inglês no website oficial">
          EN<span data-lang-full class="sr-only"> — English (site oficial)</span>
        </a>
      </div>

      <a class="btn btn-primary btn-sm" data-tickets-link data-magnetic="0.25" href="https://tickets.oceanario.pt/" target="_blank" rel="noopener noreferrer">
        Comprar bilhetes
      </a>

      <button type="button" class="menu-toggle" data-menu-toggle aria-expanded="false" aria-controls="site-menu">
        <span class="menu-toggle__icon" aria-hidden="true"><span></span><span></span></span>
        <span data-menu-label>Menu</span>
      </button>
    </div>
  </div>
</header>
