<div class="speedtest-modal" data-speedtest-modal role="dialog" aria-modal="true" aria-labelledby="speedtest-title">
  <div class="speedtest-modal__backdrop" data-speedtest-backdrop aria-hidden="true"></div>

  <div class="speedtest-modal__panel">
    <div class="speedtest-modal__head">
      <div>
        <p class="speedtest-modal__crumb">Starlink WiFi <span aria-hidden="true">›</span></p>
        <h2 class="speedtest-modal__title" id="speedtest-title">Speed Test</h2>
      </div>
      <button type="button" class="speedtest-modal__close" data-speedtest-close aria-label="Close">
        <svg class="icon" viewBox="0 0 24 24" style="width: 20px; height: 20px;">
          <path d="M6 6l12 12M18 6L6 18" stroke-width="1.8" stroke-linecap="round" />
        </svg>
      </button>
    </div>

    <div class="speedtest-modal__gauge">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <circle class="speedtest-modal__gauge-track" cx="50" cy="50" r="40"></circle>
        <circle class="speedtest-modal__gauge-fill" cx="50" cy="50" r="40"></circle>
      </svg>
      <span class="speedtest-modal__gauge-tick" style="top: 10%; left: 50%;">0</span>
      <span class="speedtest-modal__gauge-tick" style="top: 30%; left: 84.6%;">10</span>
      <span class="speedtest-modal__gauge-tick" style="top: 70%; left: 84.6%;">50</span>
      <span class="speedtest-modal__gauge-tick" style="top: 90%; left: 50%;">100</span>
      <span class="speedtest-modal__gauge-tick" style="top: 70%; left: 15.4%;">200</span>
      <span class="speedtest-modal__gauge-tick" style="top: 30%; left: 15.4%;">300</span>

      <div class="speedtest-modal__gauge-readout">
        <span class="speedtest-modal__value" data-speedtest-value>0</span>
        <span class="speedtest-modal__unit">Mbps</span>
      </div>
    </div>

    <p class="speedtest-modal__status" data-speedtest-status>Testing download…</p>
    <div class="speedtest-modal__progress">
      <div class="speedtest-modal__progress-fill" data-speedtest-progress></div>
    </div>

    <div class="speedtest-modal__metrics">
      <div class="speedtest-modal__metric">
        <span class="speedtest-modal__metric-label">
          <svg class="icon" viewBox="0 0 24 24"><path d="M12 4v13m0 0l-5-5m5 5l5-5M5 21h14" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></svg>
          Download
        </span>
        <span class="speedtest-modal__metric-value" data-speedtest-download>0 Mbps</span>
      </div>
      <div class="speedtest-modal__metric">
        <span class="speedtest-modal__metric-label">
          <svg class="icon" viewBox="0 0 24 24"><path d="M12 20V7m0 0l-5 5m5-5l5 5M5 3h14" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></svg>
          Upload
        </span>
        <span class="speedtest-modal__metric-value is-pending">— Mbps</span>
      </div>
    </div>

    <div class="speedtest-modal__mini-stats">
      <div class="speedtest-modal__mini-stat">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke-width="1.4" /><path d="M12 7v5l3.5 2" stroke-width="1.4" stroke-linecap="round" /></svg>
        Ping <strong>20 ms</strong>
      </div>
      <div class="speedtest-modal__mini-stat">
        <svg class="icon" viewBox="0 0 24 24"><path d="M2 12h3l2-6 4 12 3-9 2 5h6" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /></svg>
        Jitter <strong>3 ms</strong>
      </div>
      <div class="speedtest-modal__mini-stat">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke-width="1.4" /></svg>
        Loss <strong>0%</strong>
      </div>
    </div>

    <div class="speedtest-modal__actions">
      <button type="button" class="btn speedtest-modal__cancel" data-speedtest-cancel>
        Cancel Test
      </button>
      <a class="btn btn-primary speedtest-modal__next" data-speedtest-next href="https://www.starlink.com/residential" target="_blank" rel="noopener noreferrer">
        Next
      </a>
    </div>
  </div>
</div>
